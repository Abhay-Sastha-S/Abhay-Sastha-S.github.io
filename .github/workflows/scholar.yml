name: Refresh citation count

on:
  schedule:
    - cron: '17 6 1 * *'   # 06:17 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scholar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch per-DOI citation counts (OpenAlex, Crossref fallback)
        id: cites
        shell: bash
        run: |
          set +e   # never abort mid-fetch; we decide below
          python3 scripts/fetch_cites.py > "$RUNNER_TEMP/cites.json"
          if [ ! -s "$RUNNER_TEMP/cites.json" ]; then
            echo "::warning::Could not resolve any DOI. Keeping the last committed values."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "Counts: $(cat "$RUNNER_TEMP/cites.json")"
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the counts into the page
        if: steps.cites.outputs.ok == '1'
        run: python3 scripts/update_cites.py "$RUNNER_TEMP/cites.json"

      - name: Commit if the number changed
        if: steps.cites.outputs.ok == '1'
        run: |
          if git diff --quiet; then
            echo "Citation count unchanged - nothing to commit."
            exit 0
          fi
          git config user.name  "scholar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Scholar citation count (${{ steps.cites.outputs.count }})"
          git push
